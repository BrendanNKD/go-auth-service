# ──────────────────────────────────────────────────────────────────────────────
#  CI – Lint ▸ Test ▸ Security ▸ Build & Image Scan
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/**
      - fix/**
      - minor/**
      - breaking/**
      - major/**
      - patch/**

permissions:
  contents: read
  security-events: write

# Cancel redundant runs on the same branch / PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  pipeline-map:
    name: Pipeline Map
    runs-on: ubuntu-latest
    steps:
      - name: Publish Pipeline Map
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## CI Pipeline Map

          ```mermaid
          flowchart LR
            trigger["Commit / PR"] --> map["Pipeline Map"]
            map --> lint["Lint"]
            map --> test["Unit Tests + HTML Report"]
            map --> secret["Secret Scan"]
            map --> sca["SCA & Misconfig Scan"]
            lint --> build["Build & Image Scan"]
            test --> build
            secret --> summary["CI Summary"]
            sca --> summary
            build --> summary
          ```
          EOF

  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: pipeline-map
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Download Dependencies
        run: go mod download

      - name: Go Vet
        run: go vet ./...

  # ── 2. Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests + HTML Report
    runs-on: ubuntu-latest
    needs: pipeline-map
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Download Dependencies
        run: go mod download

      - name: Run Tests
        run: |
          go test ./... -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -json > test-report.json 2>&1

      - name: Generate HTML Test Report
        if: always()
        run: |
          mkdir -p reports
          if [ -s coverage.out ]; then
            go tool cover -html=coverage.out -o reports/coverage.html || echo "coverage.html unavailable" > reports/coverage-error.txt
            go tool cover -func=coverage.out > reports/coverage.txt || echo "coverage.txt unavailable" > reports/coverage.txt
          else
            echo "coverage.out was not produced." > reports/coverage.txt
          fi
          python3 .github/scripts/render-test-report.py \
            --json test-report.json \
            --coverage coverage.out \
            --html reports/test-report.html \
            --summary reports/test-summary.md
          cat reports/test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            reports/
            test-report.json
            coverage.out
          if-no-files-found: warn

  # ── 3. Secret Scan (Gitleaks) ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs: pipeline-map
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Dependency & Config Scan (Trivy + Snyk) ─────────────────────────────
  sca-scan:
    name: SCA & Misconfig Scan
    runs-on: ubuntu-latest
    needs: pipeline-map
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trivy filesystem scan – table output for log readability
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # Trivy filesystem scan – SARIF for GitHub Security tab
      - name: Trivy Filesystem SARIF Report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      # Snyk – conditional on token availability
      - name: Snyk Vulnerability Scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/golang@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub Security
        if: env.SNYK_TOKEN != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-fs.sarif
            snyk.sarif
          if-no-files-found: ignore

  # ── 5. Build Docker Image & Image Scan ─────────────────────────────────────
  build:
    name: Build & Image Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: authservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy image scan – table output for logs
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: authservice:ci
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # Trivy image scan – SARIF for GitHub Security tab
      - name: Trivy Image SARIF Report
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: authservice:ci
          severity: CRITICAL,HIGH
          scanners: vuln
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy Image SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, secret-scan, sca-scan, build]
    if: always()
    steps:
      - name: Publish CI Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Pipeline Result

          | Stage | Result |
          | --- | --- |
          | Lint | `${{ needs.lint.result }}` |
          | Unit Tests + HTML Report | `${{ needs.test.result }}` |
          | Secret Scan | `${{ needs['secret-scan'].result }}` |
          | SCA & Misconfig Scan | `${{ needs['sca-scan'].result }}` |
          | Build & Image Scan | `${{ needs.build.result }}` |

          ```mermaid
          flowchart LR
            lint["Lint: ${{ needs.lint.result }}"]
            test["Unit Tests + HTML Report: ${{ needs.test.result }}"]
            secret["Secret Scan: ${{ needs['secret-scan'].result }}"]
            sca["SCA & Misconfig Scan: ${{ needs['sca-scan'].result }}"]
            build["Build & Image Scan: ${{ needs.build.result }}"]
            done["CI Summary"]
            lint --> build
            test --> build
            secret --> done
            sca --> done
            build --> done
          ```
          EOF
